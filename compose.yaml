name: portfolio

services:
  caddy:
    build: ./caddy
    restart: unless-stopped
    # Lets the non-root user bind ports 80 and 443 inside its own network namespace.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      edge:
        # The backend trusts X-Forwarded-For only from this address. See TRUSTED_PROXY in the backend.
        ipv4_address: 172.30.0.10
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8080
      SITE_URL: ${SITE_URL:-http://localhost}
      QUALITY_JSON_URL: ${QUALITY_JSON_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Robots needs no backend, so a backend outage does not restart or mark down the frontend.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/portfolio
      DB_USERNAME: portfolio
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXY: 172.30.0.10/32
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_FILE: /seed/content.json
    volumes:
      - ./seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - edge
      - data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 keeps its data in a versioned folder under this path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - data
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  db-data:
