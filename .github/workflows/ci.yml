name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Includes integration tests on PostgreSQL, the API contract check and the 80% line coverage gate.
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match the contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-reports
          path: frontend/coverage

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE: docker compose --env-file e2e/e2e.env -f compose.yaml -f compose.e2e.yaml -p portfolio-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: $COMPOSE up -d --build --wait
      - name: Install the browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        working-directory: e2e
        run: npx playwright test
      - name: Failure modes
        run: sh scripts/check-failure-modes.sh
      - name: Containers do not run as root
        run: |
          for service in caddy frontend backend; do
            test "$($COMPOSE exec -T "$service" id -u)" != "0"
          done
      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/results

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node --test "scripts/*.test.mjs"

  # Publishes the real result of this run, including a failed one, for the section on the website.
  quality-report:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, security, scripts]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # A slower older run must not overwrite a newer result.
    concurrency:
      group: quality-data
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          path: reports
      - name: Build the report
        env:
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: ${{ needs.backend.result }},${{ needs.frontend.result }},${{ needs.e2e.result }},${{ needs.security.result }},${{ needs.scripts.result }}
        run: |
          export FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/build-quality-report.mjs reports quality.json
      - name: Publish to the quality-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir publish
          cp quality.json publish/
          cd publish
          git init -q -b quality-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality.json
          git commit -qm "Quality report for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" quality-data

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: No secrets anywhere in the git history
        run: >
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*"
          -v "$PWD:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts="--all"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Frontend dependencies have no high severity advisories
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
      - name: Build images to scan
        run: |
          docker build -t portfolio-backend:scan backend
          docker build -t portfolio-frontend:scan frontend
          docker build -t portfolio-caddy:scan caddy
      # v0.35.0 is the release named safe after the March 2026 tag hijack (CVE-2026-33634). Do not move
      # this pin without checking the advisory.
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: portfolio-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: portfolio-frontend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: portfolio-caddy:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
