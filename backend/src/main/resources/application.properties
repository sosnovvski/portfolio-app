spring.application.name=portfolio-app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DB_USERNAME:portfolio}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health

# Enabled only in tests and local development.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.writer-with-order-by-keys=true

# Single admin account. The application refuses to start if these are missing.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

# Client IPs come from X-Forwarded-For only when the request arrives from Caddy's fixed address.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY:172.30.0.10/32}

# Nothing here takes form-encoded PUT, PATCH or DELETE, and this filter reads such bodies without a size limit.
spring.mvc.formcontent.filter.enabled=false
server.tomcat.max-http-form-post-size=16KB

# Imports seed/content.json into an empty database. Never overwrites existing content.
app.seed.enabled=${SEED_ENABLED:false}
app.seed.file=${SEED_FILE:}
